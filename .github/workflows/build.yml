# Build and publish the image this fork exists to produce.
#
# The deployment in edialog24/telephonycluster pins an immutable tag from here, so what merges to
# main is what can be deployed, and nothing is ever built by hand on someone's laptop.
#
# Tags produced on a merge to main:
#   sha-<short>   the one deployments pin — immutable, traceable to a commit
#   main          convenience for a quick pull; never referenced by a manifest
# and on a v* git tag, the semver as well.
#
# Pull requests build but do not push, so a broken Dockerfile is caught before it reaches main.
name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A second push to the same branch makes the first one pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/edialog24/livekit-dashboard

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pipx install poetry
          poetry install --no-interaction

      - name: Pytest
        # The suite covers the local authentication change as well as upstream's own behaviour:
        # tests/test_security.py is what keeps a regression there from being invisible.
        run: poetry run pytest -q

  build:
    name: Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The repository's own token: the package lives in the same org, so no extra secret.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern=v{{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # DOKS is amd64 only; a second architecture would double the build for nothing.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: What to deploy
        if: github.event_name != 'pull_request'
        run: |
          echo "### Pin this in telephonycluster" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "k8s/livekit-dashboard/deployment.yaml" >> $GITHUB_STEP_SUMMARY
          echo "  image: ${{ env.IMAGE }}:sha-$(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
